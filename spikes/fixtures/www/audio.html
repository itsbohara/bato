<!doctype html>
<meta charset="utf-8">
<title>Audio fixture</title>
<link rel="stylesheet" href="style.css">
<h1>Audio fixture</h1>
<p>A two second 440 Hz tone loops here.</p>
<audio id="tone" src="tone.wav" autoplay loop controls></audio>
<p><button id="play" onclick="document.getElementById('tone').play()">Play</button>
<button id="pause" onclick="document.getElementById('tone').pause()">Pause</button></p>
