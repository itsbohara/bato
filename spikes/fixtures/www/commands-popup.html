<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Commands popup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>Popup sign-in</h1>
<button id="approve" type="button">Approve and close</button>
<script>
document.getElementById('approve').addEventListener('click', () => {
  window.opener.postMessage('approved', location.origin);
  window.close();
});
</script>
</main>
</body>
</html>
