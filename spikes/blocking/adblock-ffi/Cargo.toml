[package]
name = "bato-adblock-ffi"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
adblock = { version = "=0.13.5", default-features = false, features = ["full-regex-handling", "embedded-domain-resolver"] }

[profile.release]
opt-level = 3
lto = true
strip = true
